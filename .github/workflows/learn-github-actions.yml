name: learn-github-actions
run-name: teslimtobi is learning GitHub Actions
on: [push]
jobs:
  my-first-assignment:
    name: My first assignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g bats
      - run: bats -v
